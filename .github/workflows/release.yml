# Builds the Windows installer and portable zip on GitHub's machines.
#
# Release: bump the version (app/package.json, app/src-tauri/tauri.conf.json, app/src-tauri/Cargo.toml), rename
# "## Unreleased" in CHANGELOG.md to "## <version>", commit, then push a tag:  git tag v0.3.0 && git push origin v0.3.0
# A draft release with both files and the changelog section appears under Releases; check it, then Publish.
#
# Test build: Actions → Release → Run workflow. The files are attached to the run (Artifacts), no release is made.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $app (tauri.conf.json)"
            exit 1
          fi

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.mjs > ../release-notes.md

      - name: Build installer and portable zip
        run: npm run desktop:portable

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Fighting Control Center ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/portable/*.zip

      - name: Keep the files (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: fcc-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/portable/*.zip
