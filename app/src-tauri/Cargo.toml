[package]
name = "fcc"
version = "0.3.11"
description = "Fighting Control Center: configurator for Hall-effect keyboards"
authors = ["FCC"]
license = "GPL-3.0-or-later"
repository = "https://github.com/shybruh/FightingControlCenter-FCC"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
hidapi = "2.6"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
